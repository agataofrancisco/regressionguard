[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.1"]
build-backend = "setuptools.build_meta"

[project]
name = "regressionguard"
version = "0.1.0"
description = "Harness de avaliacao e deteccao de regressoes para sistemas com LLMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.4",
    "typer==0.29.2",
    "duckdb==2.0.1",
    "jinja2==3.1.6",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "jsonschema==4.26.0",
    "sqlglot==30.33.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]
dashboard = [
    "streamlit==1.67.0",
]

[project.scripts]
ai-eval = "regressionguard.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regressionguard = ["report/templates/*.html.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lab: detecao das 4 regressoes do laboratorio (corre o pipeline completo)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
